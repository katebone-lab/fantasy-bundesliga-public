name: Report MD2 price movement anomalies

on:
  push:
    branches: [main]
    paths:
      - 'scripts/report_md2_price_movement_anomalies.py'
      - 'data/fantasy_bundesliga.sqlite'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate anomaly report
        run: python scripts/report_md2_price_movement_anomalies.py
      - name: Commit report
        run: |
          if git diff --quiet -- data/md2_price_movement_anomaly_report.csv; then
            echo "Report unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/md2_price_movement_anomaly_report.csv
          git commit -m "Update MD2 price movement anomaly report"
          git push
