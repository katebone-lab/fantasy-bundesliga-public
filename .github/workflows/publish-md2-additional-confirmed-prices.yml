name: Publish additional confirmed MD2 prices

on:
  push:
    branches: [main]
    paths:
      - data/md2_additional_confirmed_prices.csv
      - scripts/apply_md2_additional_confirmed_prices.py
      - .github/workflows/publish-md2-additional-confirmed-prices.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply controlled MD2 price insertion
        run: python scripts/apply_md2_additional_confirmed_prices.py
      - name: Commit database if changed
        run: |
          if git diff --quiet -- data/fantasy_bundesliga.sqlite; then
            echo "Database unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fantasy_bundesliga.sqlite
          git commit -m "Publish Bredlow confirmed MD2 price"
          git push
