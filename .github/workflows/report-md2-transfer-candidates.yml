name: Report MD2 transfer candidates
on:
  push:
    paths:
      - 'scripts/report_md2_transfer_candidates.py'
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate transfer candidate report
        run: python scripts/report_md2_transfer_candidates.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/md2_transfer_candidate_report.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update MD2 transfer candidate report"
          git push
