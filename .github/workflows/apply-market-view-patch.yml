name: Apply positional market view patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_market_view_patch.py
      - .github/workflows/apply-market-view-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Adapt patch helper to current provenance columns
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_market_view_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "planning_score",\n        "price_m",\n        "cash_impact",\n'''
          new = '''        "planning_score",\n        "price_m",\n        "price_source",\n        "cash_impact",\n'''
          if old not in text:
              raise SystemExit('Could not adapt view-columns patch block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply market-view patch
        run: python scripts/apply_market_view_patch.py
      - name: Validate fixture model
        run: python scripts/validate_fixture_model.py
      - name: Compile changed modules
        run: python -m py_compile fixture_model.py ui/public_team_tab.py
      - name: Commit changes
        run: |
          if git diff --quiet -- fixture_model.py ui/public_team_tab.py; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixture_model.py ui/public_team_tab.py
          git commit -m "Add full positional market view"
          git push
