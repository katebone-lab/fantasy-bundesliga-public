name: Apply positional market view patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_market_view_patch_v2.py
      - .github/workflows/apply-market-view-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply market-view patch
        run: python scripts/apply_market_view_patch_v2.py
      - name: Validate fixture model
        run: python scripts/validate_fixture_model.py
      - name: Compile changed modules
        run: python -m py_compile fixture_model.py ui/public_team_tab.py
      - name: Commit changes
        run: |
          if git diff --quiet -- fixture_model.py ui/public_team_tab.py; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixture_model.py ui/public_team_tab.py
          git commit -m "Add full positional market view"
          git push
