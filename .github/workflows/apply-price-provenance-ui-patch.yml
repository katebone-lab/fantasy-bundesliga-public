name: Apply price provenance UI patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_price_provenance_ui.py
      - .github/workflows/apply-price-provenance-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply provenance UI patch
        run: python scripts/patch_price_provenance_ui.py
      - name: Compile changed UI
        run: python -m py_compile ui/public_team_tab.py
      - name: Commit UI change
        run: |
          if git diff --quiet -- ui/public_team_tab.py; then
            echo "UI unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/public_team_tab.py
          git commit -m "Clarify transfer price provenance and signals"
          git push
